{% extends "watcher/base.html" %}
{% block content %}
<h2>{% if folder %}Edit {{ folder.name }}{% else %}Add folder{% endif %}</h2>
<form method="post" id="folder-form">
  {% csrf_token %}
  <table>
    {{ form.as_table }}
  </table>
  <p id="branch-error" class="muted" style="color: #dc2626; display: none;"></p>
  <button class="btn" type="submit">Save</button>
  <a class="btn" href="{% url 'watcher:index' %}">Cancel</a>
</form>

<script>
(function () {
  var form = document.getElementById("folder-form");
  var pathInput = form.querySelector("#id_path");
  var nameInput = form.querySelector("#id_name");
  var urlInput = form.querySelector("#id_url");
  var branchSelect = form.querySelector("#id_branch");
  var errorEl = document.getElementById("branch-error");
  var branchesUrl = "{% url 'watcher:branches-for-path' %}";
  var detectUrl = "{% url 'watcher:folder-detect' %}";
  var findUrl = "{% url 'watcher:folder-find' %}";
  var savedBranch = "{{ folder.branch|default:'' }}";

  function showError(message) {
    if (message) { errorEl.textContent = message; errorEl.style.display = "block"; }
    else { errorEl.style.display = "none"; }
  }

  function setBranchOptions(data) {
    if (data && data.error) { showError(data.error); return; }
    var branches = (data && data.branches) || [];
    var placeholder = branchSelect.getAttribute("data-placeholder") || "";
    branchSelect.innerHTML = "";
    var empty = document.createElement("option");
    empty.value = ""; empty.textContent = placeholder;
    branchSelect.appendChild(empty);
    var selectedStillThere = savedBranch === "";
    branches.forEach(function (entry) {
      if (typeof entry === "string") entry = { name: entry, disabled: false };
      var opt = document.createElement("option");
      opt.value = entry.name;
      var label = entry.name;
      if (entry.current) label += " (current)";
      if (entry.disabled) label += " — no remote";
      opt.textContent = label;
      if (entry.disabled) opt.disabled = true;
      if (entry.name === savedBranch) { opt.selected = true; selectedStillThere = true; }
      branchSelect.appendChild(opt);
    });
    if (!selectedStillThere && savedBranch) {
      var keep = document.createElement("option");
      keep.value = savedBranch; keep.textContent = savedBranch + " (missing from repo)";
      keep.selected = true;
      branchSelect.appendChild(keep);
    }
    showError((data && data.no_remote_error) || "");
  }

  function refreshBranches() {
    if (!pathInput.value.trim()) return;
    fetch(branchesUrl + "?path=" + encodeURIComponent(pathInput.value))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) { if (data) setBranchOptions(data); })
      .catch(function () {});
  }

  function autodetect() {
    if (!pathInput.value.trim()) return;
    fetch(detectUrl + "?path=" + encodeURIComponent(pathInput.value))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) return;
        if (data.path) pathInput.value = data.path;
        if (data.name && !nameInput.value.trim()) nameInput.value = data.name;
        if (data.url && !urlInput.value.trim()) urlInput.value = data.url;
        if (data.branches) setBranchOptions(data);
      })
      .catch(function () {});
  }

  // ---- project dropdown ----
  var projectSelect = document.createElement("select");
  projectSelect.id = "id_project";
  projectSelect.style.marginLeft = ".4rem";
  var refreshBtn = document.createElement("button");
  refreshBtn.type = "button";
  refreshBtn.className = "btn";
  refreshBtn.textContent = "🔄";
  refreshBtn.title = "Refresh project list";
  pathInput.insertAdjacentElement("afterend", refreshBtn);
  refreshBtn.insertAdjacentElement("afterend", projectSelect);

  function loadProjects() {
    projectSelect.innerHTML = "";
    var loading = document.createElement("option");
    loading.textContent = "Loading projects…";
    projectSelect.appendChild(loading);
    fetch(findUrl)
      .then(function (r) { return r.ok ? r.json() : { error: "search failed" }; })
      .then(function (data) {
        projectSelect.innerHTML = "";
        var empty = document.createElement("option");
        empty.value = "";
        empty.textContent = "— choose a project —";
        projectSelect.appendChild(empty);
        (data.projects || []).forEach(function (p) {
          var opt = document.createElement("option");
          opt.value = p.path;
          opt.textContent = (p.registered ? "✅ " : "📦 ") + p.name + " — " + p.path;
          if (pathInput.value && p.path === pathInput.value) opt.selected = true;
          projectSelect.appendChild(opt);
        });
        if (!data.projects || !data.projects.length) {
          var none = document.createElement("option");
          none.textContent = data.error ? data.error : "No projects found";
          none.disabled = true;
          projectSelect.appendChild(none);
        }
      })
      .catch(function () {
        projectSelect.innerHTML = "";
        var err = document.createElement("option");
        err.textContent = "Failed to load projects";
        projectSelect.appendChild(err);
      });
  }

  projectSelect.addEventListener("change", function () {
    if (projectSelect.value) {
      pathInput.value = projectSelect.value;
      autodetect();
    }
  });
  refreshBtn.addEventListener("click", loadProjects);

  pathInput.addEventListener("blur", autodetect);
  pathInput.addEventListener("change", refreshBranches);
  loadProjects();
  {% if not folder %}autodetect();{% else %}refreshBranches();{% endif %}
})();
</script>
{% endblock %}
