{% extends "watcher/base.html" %}
{% block content %}
<h2>{% if folder %}Edit {{ folder.name }}{% else %}Add folder{% endif %}</h2>
<form method="post" id="folder-form">
  {% csrf_token %}
  <table>
    {{ form.as_table }}
  </table>
  <p id="branch-error" class="muted" style="color: #dc2626; display: none;"></p>
  <button class="btn" type="submit">Save</button>
  <a class="btn" href="{% url 'watcher:index' %}">Cancel</a>
</form>

<div id="picker-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:10;" hidden>
  <div id="picker" style="background:#fff; border-radius:8px; max-width:34rem; margin:4rem auto; padding:1rem 1.25rem; max-height:70vh; display:flex; flex-direction:column;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:.5rem;">
      <strong>Choose a folder</strong>
      <button type="button" class="btn" id="picker-close">✕</button>
    </div>
    <code id="picker-path" class="muted" style="margin-bottom:.5rem; display:block;"></code>
    <div id="picker-list" style="overflow-y:auto; flex:1; border:1px solid #e5e7eb; border-radius:6px;"></div>
    <div style="margin-top:.75rem; display:flex; gap:.5rem;">
      <button type="button" class="btn" id="picker-up">⬆ Up</button>
      <button type="button" class="btn" id="picker-home">🏠 Home</button>
      <button type="button" class="btn" id="picker-select" style="margin-left:auto;">Select this folder</button>
    </div>
  </div>
</div>

<script>
(function () {
  var form = document.getElementById("folder-form");
  var pathInput = form.querySelector("#id_path");
  var nameInput = form.querySelector("#id_name");
  var urlInput = form.querySelector("#id_url");
  var branchSelect = form.querySelector("#id_branch");
  var errorEl = document.getElementById("branch-error");
  var branchesUrl = "{% url 'watcher:branches-for-path' %}";
  var detectUrl = "{% url 'watcher:folder-detect' %}";
  var browseUrl = "{% url 'watcher:folder-browse' %}";
  var savedBranch = "{{ folder.branch|default:'' }}";

  var overlay = document.getElementById("picker-overlay");
  var listEl = document.getElementById("picker-list");
  var pathEl = document.getElementById("picker-path");
  var currentPath = null;

  function showError(message) {
    if (message) { errorEl.textContent = message; errorEl.style.display = "block"; }
    else { errorEl.style.display = "none"; }
  }

  function setBranchOptions(data) {
    var branches = (data && data.branches) || [];
    var placeholder = branchSelect.getAttribute("data-placeholder") || "";
    branchSelect.innerHTML = "";
    var empty = document.createElement("option");
    empty.value = ""; empty.textContent = placeholder;
    branchSelect.appendChild(empty);
    var selectedStillThere = savedBranch === "";
    branches.forEach(function (entry) {
      if (typeof entry === "string") entry = { name: entry, disabled: false };
      var opt = document.createElement("option");
      opt.value = entry.name;
      var label = entry.name;
      if (entry.current) label += " (current)";
      if (entry.disabled) label += " — no remote";
      opt.textContent = label;
      if (entry.disabled) opt.disabled = true;
      if (entry.name === savedBranch) { opt.selected = true; selectedStillThere = true; }
      branchSelect.appendChild(opt);
    });
    if (!selectedStillThere && savedBranch) {
      var keep = document.createElement("option");
      keep.value = savedBranch; keep.textContent = savedBranch + " (missing from repo)";
      keep.selected = true;
      branchSelect.appendChild(keep);
    }
    showError((data && data.no_remote_error) || "");
  }

  function loadBranches() {
    if (!pathInput.value.trim()) return Promise.resolve(null);
    return fetch(branchesUrl + "?path=" + encodeURIComponent(pathInput.value))
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; });
  }

  function refreshBranches() {
    loadBranches().then(function (data) { if (data) setBranchOptions(data); });
  }

  function autodetect() {
    if (!pathInput.value.trim()) return;
    fetch(detectUrl + "?path=" + encodeURIComponent(pathInput.value))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (data) {
        if (!data) return;
        if (data.path) pathInput.value = data.path;
        if (data.name && !nameInput.value.trim()) nameInput.value = data.name;
        if (data.url && !urlInput.value.trim()) urlInput.value = data.url;
        if (data.branches) setBranchOptions(data);
      })
      .catch(function () {});
  }

  // ---- picker ----
  function openPicker(startPath) {
    overlay.style.display = "block";
    overlay.hidden = false;
    loadPicker(startPath || pathInput.value.trim() || "~");
  }
  function closePicker() { overlay.style.display = "none"; overlay.hidden = true; }

  function loadPicker(path) {
    fetch(browseUrl + "?path=" + encodeURIComponent(path))
      .then(function (r) { return r.ok ? r.json() : { error: "cannot list" }; })
      .then(function (data) {
        if (data.error) { listEl.innerHTML = ""; pathEl.textContent = data.error; return; }
        currentPath = data.path;
        pathEl.textContent = data.path;
        listEl.innerHTML = "";
        data.dirs.forEach(function (name) {
          var row = document.createElement("button");
          row.type = "button";
          row.className = "picker-entry";
          row.textContent = "📁 " + name;
          row.dataset.name = name;
          listEl.appendChild(row);
        });
        if (!data.dirs.length) {
          listEl.innerHTML = '<p class="muted" style="padding:.5rem">No subdirectories.</p>';
        }
      })
      .catch(function () {});
  }

  listEl.addEventListener("click", function (ev) {
    var row = ev.target.closest(".picker-entry");
    if (row && currentPath) {
      loadPicker(currentPath.replace(/\/$/, "") + "/" + row.dataset.name);
    }
  });
  document.getElementById("picker-up").addEventListener("click", function () {
    if (currentPath) loadPicker(currentPath.replace(/\/[^/]*\/?$/, "") || "/");
  });
  document.getElementById("picker-home").addEventListener("click", function () { loadPicker("~"); });
  document.getElementById("picker-close").addEventListener("click", closePicker);
  overlay.addEventListener("click", function (ev) { if (ev.target === overlay) closePicker(); });
  document.getElementById("picker-select").addEventListener("click", function () {
    if (currentPath) { pathInput.value = currentPath; closePicker(); autodetect(); }
  });

  // Browse button next to the path field
  var browseBtn = document.createElement("button");
  browseBtn.type = "button";
  browseBtn.className = "btn";
  browseBtn.textContent = "📂 Browse…";
  browseBtn.addEventListener("click", function () { openPicker(); });
  pathInput.insertAdjacentElement("afterend", browseBtn);

  pathInput.addEventListener("blur", autodetect);
  pathInput.addEventListener("change", refreshBranches);
  {% if not folder %}autodetect();{% else %}refreshBranches();{% endif %}
})();
</script>
<style>
  .picker-entry { display: block; width: 100%; text-align: left; padding: .3rem .6rem; border: none; background: none; cursor: pointer; font-size: .95rem; }
  .picker-entry:hover { background: #f3f4f6; }
</style>
{% endblock %}
