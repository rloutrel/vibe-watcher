{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <title>vibe-watcher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f3f4f6; --card: #ffffff; --text: #111827; --muted: #6b7280;
      --border: #e5e7eb; --input-border: #d1d5db; --input-bg: #ffffff;
      --ok: #16a34a; --bad: #dc2626; --switch-off: #cbd5e1;
      --primary: #111827; --primary-hover: #1f2937; --hover: #f3f4f6;
      --knob-shadow: rgba(0,0,0,.25);
    }
    html[data-theme="dark"] {
      --bg: #111827; --card: #1f2937; --text: #f9fafb; --muted: #9ca3af;
      --border: #374151; --input-border: #4b5563; --input-bg: #111827;
      --ok: #22c55e; --bad: #f87171; --switch-off: #4b5563;
      --primary: #f9fafb; --primary-hover: #e5e7eb; --hover: #374151;
      --knob-shadow: rgba(0,0,0,.5);
    }
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 60rem; padding: 0 1rem; color: var(--text); background: var(--bg); }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; gap: .5rem; flex-wrap: wrap; }
    h1 { font-size: 1.5rem; margin: 0; }
    .header-right { display: flex; align-items: center; gap: .6rem; }
    .badge { padding: .2rem .6rem; border-radius: 999px; font-size: .85rem; font-weight: 600; color: #fff; }
    .badge.ok { background: var(--ok); }
    .badge.stale, .badge.never-run { background: var(--bad); }
    table { border-collapse: collapse; width: 100%; margin-bottom: 2rem; }
    th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { background: var(--card); }
    code { background: var(--hover); padding: 0 .25rem; border-radius: 3px; }
    .muted, .hint { color: var(--muted); font-size: .9rem; }
    .btn { display: inline-block; padding: .35rem .7rem; border: 1px solid var(--input-border); border-radius: 6px; text-decoration: none; font-size: .9rem; background: var(--card); color: var(--text); }
    .btn.danger { color: var(--bad); }
    .btn.primary { background: var(--primary); color: var(--bg); border-color: var(--primary); }
    .btn.primary:hover { background: var(--primary-hover); }
    form.inline { display: inline; }
    .icon-btn { text-decoration: none; border: none; background: none; font-size: 1.1rem; cursor: pointer; padding: .1rem .25rem; color: var(--text); }
    .switch { box-sizing: border-box; width: 2.4rem; height: 1.25rem; border-radius: 999px; border: none; position: relative; cursor: pointer; padding: 0; transition: background .15s ease; vertical-align: middle; }
    .switch .knob { box-sizing: border-box; position: absolute; top: 50%; left: 2px; width: 1rem; height: 1rem; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px var(--knob-shadow); transform: translateY(-50%); transition: left .15s ease; }
    .switch.on { background: var(--ok); }
    .switch.off { background: var(--switch-off); }
    .switch:hover .knob { box-shadow: 0 1px 4px var(--knob-shadow); }
    .switch.on .knob { left: calc(100% - 1rem - 2px); }
    .theme-toggle { border: 1px solid var(--input-border); background: var(--card); border-radius: 6px; cursor: pointer; font-size: 1rem; padding: .2rem .45rem; }
    .lang-picker { display: flex; gap: .25rem; border: 1px solid var(--input-border); background: var(--card); border-radius: 6px; padding: .1rem; }
    .lang-btn { border: none; background: none; cursor: pointer; font-size: 1.05rem; padding: .1rem .3rem; border-radius: 4px; opacity: .55; }
    .lang-btn.active { opacity: 1; background: var(--hover); }
  </style>
</head>
<body>
<header>
  <h1>vibe-watcher</h1>
  <div class="header-right">
    <form method="post" action="{% url 'set_language' %}" class="inline lang-picker" id="lang-form">
      {% csrf_token %}
      <input name="next" type="hidden" value="{{ request.path }}">
      <button type="submit" name="language" value="fr" class="lang-btn {% if LANGUAGE_CODE == 'fr' %}active{% endif %}" title="Français">🇫🇷</button>
      <button type="submit" name="language" value="de" class="lang-btn {% if LANGUAGE_CODE == 'de' %}active{% endif %}" title="Deutsch">🇩🇪</button>
      <button type="submit" name="language" value="en" class="lang-btn {% if LANGUAGE_CODE == 'en' %}active{% endif %}" title="English">🇬🇧</button>
    </form>
    <button type="button" class="theme-toggle" id="theme-toggle" title="Toggle dark/light">🌙</button>
    {% if user.is_authenticated %}
      <a class="btn" href="{% url 'admin:index' %}">Admin</a>
      <form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}<button class="btn" type="submit">{% translate "Log out" %}</button></form>
    {% endif %}
  </div>
</header>
<script>
(function () {
  var html = document.documentElement;
  var saved = localStorage.getItem("vibe-theme");
  if (saved) html.setAttribute("data-theme", saved);
  function current() { return html.getAttribute("data-theme") || "light"; }
  var btn = document.getElementById("theme-toggle");
  function sync() { btn.textContent = current() === "dark" ? "☀️" : "🌙"; }
  btn.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    html.setAttribute("data-theme", next);
    localStorage.setItem("vibe-theme", next);
    sync();
  });
  sync();
})();
</script>
{% block content %}{% endblock %}
</body>
</html>
