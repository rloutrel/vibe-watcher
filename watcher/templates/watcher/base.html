<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>vibe-watcher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --ok: #16a34a; --warn: #d97706; --bad: #dc2626; }
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 60rem; padding: 0 1rem; color: #111; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; margin: 0; }
    .badge { padding: .2rem .6rem; border-radius: 999px; font-size: .85rem; font-weight: 600; color: #fff; }
    .badge.ok { background: var(--ok); }
    .badge.stale, .badge.never-run { background: var(--bad); }
    table { border-collapse: collapse; width: 100%; margin-bottom: 2rem; }
    th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid #e5e7eb; vertical-align: top; }
    th { background: #f9fafb; }
    code { background: #f3f4f6; padding: 0 .25rem; border-radius: 3px; }
    .muted { color: #6b7280; font-size: .9rem; }
    .btn { display: inline-block; padding: .35rem .7rem; border: 1px solid #d1d5db; border-radius: 6px; text-decoration: none; font-size: .9rem; background: #fff; }
    .btn.danger { color: var(--bad); }
    form.inline { display: inline; }
    .icon-btn { text-decoration: none; border: none; background: none; font-size: 1.1rem; cursor: pointer; padding: .1rem .25rem; }
    .switch { box-sizing: border-box; width: 2.4rem; height: 1.25rem; border-radius: 999px; border: none; position: relative; cursor: pointer; padding: 0; transition: background .15s ease; vertical-align: middle; }
    .switch .knob { box-sizing: border-box; position: absolute; top: 50%; left: 2px; width: 1rem; height: 1rem; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transform: translateY(-50%); transition: left .15s ease; }
    .switch.on { background: var(--ok); }
    .switch.off { background: #cbd5e1; }
    .switch:hover .knob { box-shadow: 0 1px 4px rgba(0,0,0,.35); }
    .switch.on .knob { left: calc(100% - 1rem - 2px); }
  </style>
</head>
<body>
<header>
  <h1>vibe-watcher</h1>
  <div>
    {% if user.is_authenticated %}
      <a href="{% url 'watcher:config-page' %}">Config</a> ·
      <a href="{% url 'admin:index' %}">Admin</a> ·
      <form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}<button class="btn" type="submit">Log out</button></form>
    {% endif %}
  </div>
</header>
{% block content %}{% endblock %}
</body>
</html>
