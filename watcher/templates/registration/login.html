{% extends "watcher/base.html" %}
{% load i18n %}
{% block content %}
<style>
  form input { padding: .4rem .55rem; border: 1px solid var(--input-border); border-radius: 8px; font-size: .95rem; background: var(--input-bg); color: var(--text); }
</style>
<h2>{% translate "Log in" %}</h2>
<form method="post">
  {% csrf_token %}
  <table>{{ form.as_table }}</table>
  <button class="btn primary" type="submit" title="{% translate 'Log in' %}" aria-label="{% translate 'Log in' %}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg></button>
</form>
{% if form.errors %}
<p class="muted">{% translate "Your username and password didn't match. Please try again." %}</p>
{% endif %}
{% endblock %}
