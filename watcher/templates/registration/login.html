{% extends "watcher/base.html" %}
{% load i18n %}
{% block content %}
<h2>{% translate "Log in" %}</h2>
<form method="post">
  {% csrf_token %}
  <table>{{ form.as_table }}</table>
  <button class="btn" type="submit">{% translate "Log in" %}</button>
</form>
{% if form.errors %}
<p class="muted">{% translate "Your username and password didn't match. Please try again." %}</p>
{% endif %}
{% endblock %}
